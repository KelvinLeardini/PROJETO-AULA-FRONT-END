<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - Keep Keys</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="favicon" href="/imagens/Logo-1.png" type="image/png">
    
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body id="aplicativo">
    
    <!-- Barra Lateral -->
    <aside>
        <div class="logo">
            <a href="/index.html" class="logo-link"><img src="/imagens/Logo-1.png" alt="logo da loja"></a>
        </div>
        <nav>
            <ul>
                <li><a href="#"><i data-lucide="layout-dashboard"></i> Dashboard</a></li>
                <li><a href="#"><i data-lucide="gamepad-2"></i> Jogos</a></li>
                <hr class="divisoria">
                <li><a href="/index.html"><i data-lucide="store"></i> Voltar à Loja</a></li>
            </ul>
        </nav>
        <div class="footer-redes">
            <div class="icones-redes">
                <a href="#" aria-label="Instagram"><img src="/imagens/INSTLOGO.webp" alt="Instagram"></a>
            </div>
        </div>
    </aside>

    <div class="site">
        <!-- Cabeçalho -->
        <header>
            <button type="button" class="btn-hamburguer" id="btn-hamburguer" aria-label="Abrir Menu">
                <span></span><span></span><span></span>
            </button>
            <form action="#">
                <div class="buscar">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#888888" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" placeholder="Painel Administrativo" disabled>
                </div>
            </form>
            <div class="area-usuario">
                <div class="painel-usuario">
                    <span><i data-lucide="shield-alert" style="margin-right: 5px; color: #ff9900;"></i> Administrador</span>
                    <button type="button" @click="sairDoPainel" class="btn-sair">Sair</button>
                </div>
            </div>
        </header>

        <!-- CONTEÚDO DO PAINEL -->
        <main class="admin-container">
            
            <!-- Cards de Estatísticas -->
            <div class="admin-estatisticas">
                <div class="admin-card-stats">
                    <div class="icone"><i data-lucide="gamepad-2"></i></div>
                    <div>
                        <h4>Total de Jogos</h4>
                        <p>{{ listaJogos.length }}</p>
                    </div>
                </div>
                <div class="admin-card-stats verde">
                    <div class="icone"><i data-lucide="server"></i></div>
                    <div>
                        <h4>Status do Servidor</h4>
                        <p>Online</p>
                    </div>
                </div>
            </div>

            <!-- Dashboard Dividido -->
            <div class="admin-dashboard">
                
                <!-- Coluna Esquerda: Formulário -->
                <section class="bloco-lateral" style="margin: 0; padding: 25px;">
                    <h2 class="admin-titulo-secao">Novo Jogo</h2>
                    <form @submit.prevent="adicionarJogo" class="admin-form">
                        <input v-model="novoJogo.titulo" type="text" placeholder="Nome do Jogo" required>
                        <input v-model="novoJogo.preco" type="text" placeholder="Preço (ex: 299,90)" required>
                        <input v-model="novoJogo.imagem" type="text" placeholder="Caminho da imagem (/imagens/...)" required>
                        <select v-model="novoJogo.plataforma" required>
                            <option value="" disabled>Selecione a Plataforma</option>
                            <option value="ps">PlayStation</option>
                            <option value="xbox">Xbox</option>
                            <option value="steam">Steam</option>
                        </select>
                        <button type="submit"><i data-lucide="plus-circle"></i> Cadastrar</button>
                    </form>
                </section>

                <!-- Coluna Direita: Catálogo (Usando sua classe de card adaptada) -->
                <section class="bloco-lateral" style="margin: 0; padding: 25px;">
                    <h2 class="admin-titulo-secao">Gerenciador de Catálogo</h2>
                    
                    <div class="admin-grade-produtos">
                        <article v-for="jogo in listaJogos" :key="jogo.id" class="jogo-produtos">
                            <img :src="jogo.imagem" alt="Capa">
                            <h4>{{ jogo.titulo }}</h4>
                            <span class="tag-plataforma">{{ jogo.plataforma }}</span>
                            <p style="font-size: 1rem; margin-bottom: 10px;">R$ {{ jogo.preco }}</p>
                            
                            <!-- Botão de Excluir que sobrepõe o de comprar -->
                            <button type="button" @click="excluirJogo(jogo.id)">
                                <i data-lucide="trash-2"></i> EXCLUIR
                            </button>
                        </article>
                    </div>
                </section>

            </div>
        </main>
    </div>

    <!-- Script Vue Integrado -->
    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    listaJogos: [],
                    novoJogo: { titulo: '', preco: '', imagem: '', plataforma: '' }
                }
            },
            methods: {
                verificarAcesso() {
                    const cargo = localStorage.getItem('usuarioRole');
                    if (cargo !== 'admin') window.location.href = 'index.html'; 
                },
                async carregarJogos() {
                    try {
                        const resposta = await fetch('/api/jogos');
                        this.listaJogos = await resposta.json();
                    } catch (erro) {
                        console.error('Erro ao carregar jogos', erro);
                    }
                },
                async adicionarJogo() {
                    try {
                        const resposta = await fetch('/api/jogos', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(this.novoJogo)
                        });
                        
                        if (resposta.ok) {
                            const dados = await resposta.json();
                            this.listaJogos.push(dados.jogo); 
                            this.novoJogo = { titulo: '', preco: '', imagem: '', plataforma: '' }; 
                            setTimeout(() => lucide.createIcons(), 50);
                        }
                    } catch (erro) {
                        alert('Erro ao salvar jogo no servidor.');
                    }
                },
                async excluirJogo(id) {
                    if(confirm('Tem certeza que deseja remover este jogo da loja?')) {
                        try {
                            const resposta = await fetch(`/api/jogos/${id}`, { method: 'DELETE' });
                            if (resposta.ok) {
                                this.listaJogos = this.listaJogos.filter(j => j.id !== id);
                            }
                        } catch (erro) {
                            alert('Erro ao excluir jogo.');
                        }
                    }
                },
                sairDoPainel() {
                    localStorage.removeItem('usuarioLogado');
                    localStorage.removeItem('usuarioRole');
                    localStorage.removeItem('usuarioNome');
                    window.location.href = 'index.html';
                }
            },
            mounted() {
                this.verificarAcesso(); 
                this.carregarJogos();
            },
            updated() {
                lucide.createIcons();
            }
        }).mount('#aplicativo');
    </script>

    <!-- CDN do Lucide Icons (Sempre em cima) -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Vincula o JavaScript -->
    <script src="/js/script.js"></script>
</body>
</html>
